spring.application.name=openlodge

# base en Neon, la contraseña va en la variable DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-steep-sun-b6xrir5a.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# las tablas las crea db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# tamaño maximo de las fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
