spring.application.name=openlodge

# Base PostgreSQL en Neon. La contraseña NO va en el repo: se lee de la variable de entorno DB_PASSWORD.
# DB_URL y DB_USER tienen valor por defecto; se pueden pisar con variables de entorno (por ejemplo, para una base local).
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-steep-sun-b6xrir5a.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# La estructura la crea el script db/schema.sql; Hibernate solo verifica que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
