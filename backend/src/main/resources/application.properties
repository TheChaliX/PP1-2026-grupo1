spring.application.name=openlodge

# base en Neon, la contraseña va en la variable DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# las tablas las crea db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# tamaño maximo de las fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# envio de correos por SMTP. Con Gmail hay que usar una "contraseña de aplicación"
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USER:}}

# desde donde se sirve el frontend (para armar el link del correo de confirmacion)
app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500/frontend}
