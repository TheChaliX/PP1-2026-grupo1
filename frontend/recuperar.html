<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="login">

  <div id="navbar-dinamica"></div>

  <main class="auth-main">
    <div class="auth-header">
      <div class="auth-logo"><i class="bi bi-envelope-open-heart-fill"></i></div>
      <h1>Recuperar contraseña</h1>
      <p id="textoPaso">Ingresá el email de tu cuenta para recibir un código</p>
    </div>

    <!-- paso 1 -->
    <form id="formRecuperar" novalidate>
      <div class="campo-grupo">
        <label for="email"><i class="bi bi-envelope"></i> Email de tu cuenta</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-envelope-fill input-icono"></i>
          <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <span class="campo-error" id="err-email"></span>
      </div>

      <button type="submit" class="btn-auth">
        <i class="bi bi-send-fill"></i> Pedir código
      </button>
    </form>

    <!-- paso 2 -->
    <form id="formRestablecer" novalidate style="display: none;">
      <div class="recuperar-codigo">
        <p><i class="bi bi-info-circle-fill"></i> El envío de correos todavía no está activo, así que te mostramos el código acá:</p>
        <p class="recuperar-codigo-valor" id="codigoGenerado"></p>
        <small>Vence en 10 minutos.</small>
      </div>

      <div class="campo-grupo">
        <label for="codigo"><i class="bi bi-key"></i> Código</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-123 input-icono"></i>
          <input type="text" id="codigo" name="codigo" inputmode="numeric" maxlength="6" placeholder="6 dígitos" autocomplete="one-time-code">
        </div>
        <span class="campo-error" id="err-codigo"></span>
      </div>

      <div class="campo-grupo">
        <label for="password"><i class="bi bi-lock"></i> Nueva contraseña</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-lock-fill input-icono"></i>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>
        <span class="campo-error" id="err-password"></span>
      </div>

      <div class="campo-grupo">
        <label for="confirmPassword"><i class="bi bi-lock"></i> Repetir contraseña</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-lock-fill input-icono"></i>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repetí la nueva contraseña" autocomplete="new-password">
        </div>
        <span class="campo-error" id="err-confirmPassword"></span>
      </div>

      <button type="submit" class="btn-auth">
        <i class="bi bi-check2-circle"></i> Cambiar contraseña
      </button>
    </form>

    <p class="auth-separador"><a href="login.html"><i class="bi bi-arrow-left"></i> Volver al login</a></p>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/recuperar.js"></script>
</body>
</html>
