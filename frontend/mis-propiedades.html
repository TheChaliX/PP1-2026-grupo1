<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis propiedades — AlojAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="mis-propiedades">

  <div id="navbar-dinamica"></div>

  <main class="propiedades-main">
    <header class="page-header">
      <h1><i class="bi bi-house-door-fill"></i> Panel del anfitrión</h1>
      <p>Administrá tus propiedades publicadas</p>
    </header>

    <section class="lista-propiedades" id="listaPropiedadesAnfitrion">
      <!-- Carga inicial hardcodeada de ejemplo, en una versión real esto se carga con JS -->
      <article class="propiedad-card shadow-sm">
        <div class="propiedad-foto">
            <img src="assets/img/img-cordoba.jpg" alt="Casa en las montañas">
        </div>
        <div class="propiedad-info">
          <h2>Casa en las montañas</h2>
          <span class="badge estado publicada">Publicada</span>
          <div class="acciones-propiedad">
              <a href="#editar-1" class="btn-editar"><i class="bi bi-pencil-square"></i> Editar</a>
              <button type="button" class="btn-retirar"><i class="bi bi-x-circle"></i> Retirar</button>
          </div>
        </div>
      </article>

      <article class="propiedad-card shadow-sm">
        <div class="propiedad-foto">
            <img src="assets/img/img-villacp.webp" alt="Cabaña con pileta">
        </div>
        <div class="propiedad-info">
          <h2>Cabaña con pileta</h2>
          <span class="badge estado retirada">Retirada</span>
          <div class="acciones-propiedad">
              <a href="#editar-2" class="btn-editar"><i class="bi bi-pencil-square"></i> Editar</a>
              <button type="button" class="btn-retirar"><i class="bi bi-arrow-counterclockwise"></i> Reactivar</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    // Proteger ruta
    requerirSesion("anfitrion");
  </script>
</body>
</html>
