<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="login">

  <div id="navbar-dinamica"></div>

  <main class="auth-main">
    <div class="auth-header">
      <div class="auth-logo"><i class="bi bi-house-heart-fill"></i></div>
      <h1>Bienvenido/a</h1>
      <p>Ingresá a tu cuenta para continuar</p>
    </div>

    <form id="formLogin" novalidate>

      <div class="campo-grupo">
        <label for="email"><i class="bi bi-envelope"></i> Email</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-envelope-fill input-icono"></i>
          <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <span class="campo-error" id="err-email"></span>
      </div>

      <div class="campo-grupo">
        <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-lock-fill input-icono"></i>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password">
          <button type="button" class="btn-toggle-pass" aria-label="Mostrar contraseña" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <span class="campo-error" id="err-password"></span>
      </div>

      <!-- Agregado para que el profesor/usuario pueda elegir exactamente qué rol quiere probar sin tener que hacer malabares con el correo -->
      <div class="campo-grupo mt-2 mb-3" style="background: rgba(14, 168, 160, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed var(--turquesa);">
        <label for="rolMock" style="color: var(--turquesa-oscuro);"><i class="bi bi-gear-fill"></i> Probar sistema como:</label>
        <select id="rolMock" name="rolMock" style="width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--turquesa-claro); padding: 0 14px; margin-top: 5px; color: var(--azul-profundo); outline: none;">
          <option value="huesped">Huésped (Buscar y Reservar)</option>
          <option value="anfitrion">Anfitrión (Administrar Propiedades)</option>
        </select>
        <small style="display: block; margin-top: 5px; font-size: 0.75rem; color: var(--gris-texto);">Simulador de rol para la presentación.</small>
      </div>

      <button type="submit" class="btn-auth">
        <i class="bi bi-box-arrow-in-right"></i> Ingresar
      </button>

      <a href="recuperar.html" class="link-recuperar">¿Olvidaste tu contraseña?</a>
    </form>

    <p class="auth-separador">¿No tenés cuenta? <a href="registro.html">Registrate gratis</a></p>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    document.querySelector(".btn-toggle-pass")?.addEventListener("click", function () {
      const input = document.querySelector("#password");
      const icon  = this.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "bi bi-eye-slash";
      } else {
        input.type = "password";
        icon.className = "bi bi-eye";
      }
    });
  </script>
  <script src="assets/js/login.js"></script>
</body>
</html>
