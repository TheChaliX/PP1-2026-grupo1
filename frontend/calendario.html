<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

  <div id="navbar-dinamica"></div>

  <header class="page-header">
    <h1><i class="bi bi-calendar3"></i> Panel del anfitrión</h1>
    <p>Calendario de disponibilidad</p>
  </header>

  <main class="contenedor-calendario">
    <h2>Gestionar disponibilidad</h2>
    <div class="selector-propiedad">
      <label for="propiedad"><i class="bi bi-house"></i> Propiedad</label>
      <select id="propiedad" name="propiedad" class="input-select">
        <option value="casa-montanas">Casa en las montañas</option>
        <option value="cabana-pileta">Cabaña con pileta</option>
      </select>
    </div>

    <div class="leyenda">
        <div><span class="estado libre"></span> Libre</div>
        <div><span class="estado ocupada"></span> Ocupada</div>
        <div><span class="estado bloqueada"></span> Bloqueada</div>
    </div>

    <div class="card-calendario">
        <h3>Agosto 2026</h3>
        <table class="calendario">
            <thead>
                <tr>
                    <th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th><th>Dom</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td></td><td></td><td class="libre">1</td><td class="ocupada">2</td><td class="libre">3</td><td class="bloqueada">4</td><td class="libre">5</td>
                </tr>
                <tr>
                    <td class="libre">6</td><td class="libre">7</td><td class="ocupada">8</td><td class="ocupada">9</td><td class="libre">10</td><td class="bloqueada">11</td><td class="libre">12</td>
                </tr>
                <tr>
                    <td class="libre">13</td><td class="libre">14</td><td class="libre">15</td><td class="bloqueada">16</td><td class="libre">17</td><td class="ocupada">18</td><td class="libre">19</td>
                </tr>
                <tr>
                    <td class="libre">20</td><td class="libre">21</td><td class="bloqueada">22</td><td class="libre">23</td><td class="libre">24</td><td class="ocupada">25</td><td class="libre">26</td>
                </tr>
                <tr>
                    <td class="libre">27</td><td class="libre">28</td><td class="libre">29</td><td class="bloqueada">30</td><td class="libre">31</td><td></td><td></td>
                </tr>
            </tbody>
        </table>

        <div class="formulario-bloqueo mt-4">
            <label><i class="bi bi-pencil-square"></i> Motivo del bloqueo (opcional)</label>
            <textarea rows="3" placeholder="Ej: Mantenimiento..."></textarea>
            <div class="botones-calendario mt-2">
                <button class="btn-reserve"><i class="bi bi-lock-fill"></i> Bloquear</button>
                <button class="btn-secundario"><i class="bi bi-unlock-fill"></i> Liberar</button>
            </div>
        </div>
    </div>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    // Proteger ruta
    requerirSesion("anfitrion");
  </script>
</body>
</html>
