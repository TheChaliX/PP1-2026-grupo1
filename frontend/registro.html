<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <!-- Ruta corregida a tu hoja de estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="registro">

    <header>
        <nav class="navbar">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="reservas.html">Mis reservas</a>
            <a href="login.html">Login</a>
            <a href="mis-propiedades.html">Mis propiedades</a>
            <a href="calendario.html">Calendario</a>
            <a href="reservas-recibidas.html">Reservas recibidas</a>
            <a href="registro.html">Registro</a>
        </nav>

        <h1>Crear cuenta</h1>
        <p>Registrate como huésped o como anfitrión</p>
    </header>

    <main class="registro-main">
        <form id="registerForm" novalidate>
            <label for="fullName">Nombre completo</label>
            <input type="text" id="fullName" name="fullName" placeholder="Como en tu documento">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="vos@ejemplo.com">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">

            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repetí tu contraseña">

            <fieldset class="rol-field">
                <legend>¿Cómo querés operar?</legend>

                <label class="rol-opcion">
                    <input type="radio" id="roleGuest" name="rol" value="huesped" checked>
                    Huésped — Quiero reservar alojamientos
                </label>

                <label class="rol-opcion">
                    <input type="radio" id="roleHost" name="rol" value="anfitrion">
                    Anfitrión — Quiero publicar mi alojamiento
                </label>
            </fieldset>

            <!-- Mensaje de error / éxito cargado desde JS -->
            <p id="mensajeError" class="mensaje-error"></p>

            <div class="botones-registro">
                <button type="submit" class="btn-crear-cuenta">Crear cuenta</button>
            </div>

            <p class="ya-tenes-cuenta">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
        </form>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>
