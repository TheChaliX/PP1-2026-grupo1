<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="registro">

  <div id="navbar-dinamica"></div>

  <main class="auth-main auth-main--registro">
    <div class="auth-header">
      <div class="auth-logo"><i class="bi bi-house-heart-fill"></i></div>
      <h1>Crear cuenta</h1>
      <p>Registrate como huésped o como anfitrión</p>
    </div>

    <form id="registerForm" novalidate>

            <div class="campo-grupo">
        <label for="nombre"><i class="bi bi-person"></i> Nombre</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-person-fill input-icono"></i>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="given-name">
        </div>
        <span class="campo-error" id="err-nombre"></span>
      </div>

      <div class="campo-grupo">
        <label for="apellido"><i class="bi bi-person"></i> Apellido</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-person-fill input-icono"></i>
          <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" autocomplete="family-name">
        </div>
        <span class="campo-error" id="err-apellido"></span>
      </div>

      <div class="campo-grupo">
        <label for="email"><i class="bi bi-envelope"></i> Email</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-envelope-fill input-icono"></i>
          <input type="email" id="email" name="email" placeholder="vos@ejemplo.com" autocomplete="email">
        </div>
        <span class="campo-error" id="err-email"></span>
      </div>

      <div class="campo-grupo">
        <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-lock-fill input-icono"></i>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
          <button type="button" class="btn-toggle-pass" data-target="password" aria-label="Mostrar contraseña" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <span class="campo-error" id="err-password"></span>
      </div>

      <div class="campo-grupo">
        <label for="confirmPassword"><i class="bi bi-lock-fill"></i> Confirmar contraseña</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-lock-fill input-icono"></i>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repetí tu contraseña" autocomplete="new-password">
          <button type="button" class="btn-toggle-pass" data-target="confirmPassword" aria-label="Mostrar contraseña" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <span class="campo-error" id="err-confirmPassword"></span>
      </div>

      <button type="submit" class="btn-auth">
        <i class="bi bi-person-check"></i> Crear cuenta
      </button>

      <p class="auth-separador">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </form>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    document.querySelectorAll(".btn-toggle-pass").forEach((btn) => {
      btn.addEventListener("click", function () {
        const targetId = this.dataset.target;
        const input    = document.getElementById(targetId);
        const icon     = this.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "bi bi-eye-slash";
        } else {
          input.type = "password";
          icon.className = "bi bi-eye";
        }
      });
    });
  </script>
  <script src="assets/js/registro.js"></script>
</body>
</html>
