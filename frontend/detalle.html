<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del alojamiento — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="detalle">

  <div id="navbar-dinamica"></div>

  <div id="mensajeEstado"></div>

  <main class="detalle-alojamiento" id="contenidoDetalle">
    <h1 id="nombreAlojamiento">Cargando alojamiento...</h1>
    <div id="ratingAlojamiento"></div>

    <section class="galeria">
      <img id="imagenAlojamiento" src="" alt="Alojamiento">
    </section>

    <div class="contenedor-dos-columnas">

      <div class="columna-izq">
        <section class="descripcion">
          <h2><i class="bi bi-file-text"></i> Descripción</h2>
          <p id="descripcionTexto"></p>
          <ul class="detalle-meta">
            <li><i class="bi bi-geo-alt-fill"></i> <span id="ubicacion"></span></li>
            <li><i class="bi bi-cash-coin"></i> $<span id="precio"></span> por noche</li>
            <li><i class="bi bi-people-fill"></i> Hasta <span id="capacidad"></span> huéspedes</li>
          </ul>
        </section>

        <section class="datos-anfitrion">
          <h2><i class="bi bi-person-badge"></i> Anfitrión</h2>
          <p><span id="anfitrion">—</span></p>
          <p class="text-muted">Responde consultas de manera personalizada.</p>
        </section>

        <section class="servicios">
          <h2><i class="bi bi-star"></i> Servicios y comodidades</h2>
          <ul id="listaServicios" class="lista-servicios">
            <li>Cargando servicios...</li>
          </ul>
        </section>

        <section class="reservas-realizadas">
          <h2><i class="bi bi-calendar-check"></i> Reservas sobre este alojamiento</h2>
          <div id="listaReservas"></div>
        </section>
      </div>

      <div class="columna-der">
        <section class="disponibilidad">
          <h2><i class="bi bi-calendar3"></i> Disponibilidad y reserva</h2>
          <form id="formReserva" novalidate>

            <div class="campo-grupo">
              <label for="entrada"><i class="bi bi-calendar-event"></i> Fecha de entrada</label>
              <input type="date" id="entrada" name="entrada" required>
              <span class="campo-error" id="err-entrada"></span>
            </div>

            <div class="campo-grupo">
              <label for="salida"><i class="bi bi-calendar-check"></i> Fecha de salida</label>
              <input type="date" id="salida" name="salida" required>
              <span class="campo-error" id="err-salida"></span>
            </div>

            <div class="campo-grupo">
              <label for="huespedes"><i class="bi bi-people"></i> Huéspedes</label>
              <div class="input-icono-wrapper">
                <i class="bi bi-people-fill input-icono"></i>
                <input type="number" id="huespedes" name="huespedes" min="1" max="20" required>
              </div>
              <span class="campo-error" id="err-huespedes"></span>
            </div>

            <p id="mensajeReserva" class="mensaje-error"></p>
            <button type="submit" class="btn-reserve">
              <i class="bi bi-check-circle"></i> Confirmar reserva
            </button>
          </form>
        </section>
      </div>

    </div>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/detalle.js"></script>
</body>
</html>
