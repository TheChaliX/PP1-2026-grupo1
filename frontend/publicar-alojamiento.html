<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar alojamiento — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="publicar">

  <div id="navbar-dinamica"></div>

  <main class="publicar-main">
    <header class="page-header">
      <h1><i class="bi bi-plus-circle-fill"></i> Publicar alojamiento</h1>
      <p>Completá los datos para que los huéspedes puedan encontrarte</p>
    </header>

    <form id="formPublicar" class="form-publicar" novalidate>

      <div class="campo-grupo">
        <label for="nombre"><i class="bi bi-tag"></i> Nombre del alojamiento</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-house-door-fill input-icono"></i>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Cabaña del lago">
        </div>
        <span class="campo-error" id="err-nombre"></span>
      </div>

      <div class="campo-grupo">
        <label for="descripcion"><i class="bi bi-file-text"></i> Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="5" placeholder="Contá los detalles más atractivos de tu espacio..."></textarea>
        <span class="campo-error" id="err-descripcion"></span>
      </div>

      <div class="campo-grupo">
        <label for="ubicacion"><i class="bi bi-geo-alt"></i> Ubicación</label>
        <div class="input-icono-wrapper">
          <i class="bi bi-geo-alt-fill input-icono"></i>
          <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej: Villa Carlos Paz, Córdoba">
        </div>
        <span class="campo-error" id="err-ubicacion"></span>
      </div>

      <div class="campo-grupo">
        <label for="tipo"><i class="bi bi-building"></i> Tipo de alojamiento</label>
        <select id="tipo" name="tipo">
          <option value="">Seleccione una opción</option>
          <option value="Cabaña">Cabaña</option>
          <option value="Casa">Casa</option>
          <option value="Casa quinta">Casa quinta</option>
          <option value="Chalet">Chalet</option>
          <option value="Departamento">Departamento</option>
          <option value="Dúplex">Dúplex</option>
          <option value="Hotel">Hotel</option>
          <option value="Hostel">Hostel</option>
          <option value="Estancia">Estancia</option>
        </select>
        <span class="campo-error" id="err-tipo"></span>
      </div>

      <fieldset class="campo-fieldset">
        <legend><i class="bi bi-info-square"></i> Precio y capacidad</legend>
        <div class="fila-datos">
          <div class="campo-grupo">
            <label for="precioNoche">Precio/Noche ($)</label>
            <div class="input-icono-wrapper">
              <i class="bi bi-currency-dollar input-icono"></i>
              <input type="number" id="precioNoche" name="precioNoche" min="0" placeholder="Ej: 45000">
            </div>
            <span class="campo-error" id="err-precio"></span>
          </div>
          <div class="campo-grupo">
            <label for="huespedes">Huéspedes</label>
            <div class="input-icono-wrapper">
              <i class="bi bi-people-fill input-icono"></i>
              <input type="number" id="huespedes" name="huespedes" min="1" placeholder="Ej: 4">
            </div>
            <span class="campo-error" id="err-huespedes"></span>
          </div>
          <div class="campo-grupo">
            <label for="habitaciones">Habitaciones</label>
            <div class="input-icono-wrapper">
              <i class="bi bi-door-open-fill input-icono"></i>
              <input type="number" id="habitaciones" name="habitaciones" min="1" placeholder="Ej: 2">
            </div>
            <span class="campo-error" id="err-habitaciones"></span>
          </div>
          <div class="campo-grupo">
            <label for="camas">Camas</label>
            <div class="input-icono-wrapper">
              <i class="bi bi-moon-stars-fill input-icono"></i>
              <input type="number" id="camas" name="camas" min="1" placeholder="Ej: 3">
            </div>
            <span class="campo-error" id="err-camas"></span>
          </div>
          <div class="campo-grupo">
            <label for="banos">Baños</label>
            <div class="input-icono-wrapper">
              <i class="bi bi-droplet-fill input-icono"></i>
              <input type="number" id="banos" name="banos" min="1" placeholder="Ej: 1">
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset class="campo-fieldset">
        <legend><i class="bi bi-star"></i> Servicios y comodidades</legend>
        <div class="servicios-grid servicios-grid-grande">

          <label class="servicio-check"><input type="checkbox" name="servicios" value="Wi-Fi"> <span><i class="bi bi-wifi"></i> Wi-Fi</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Cocina"> <span><i class="bi bi-cup-hot"></i> Cocina</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Pileta"> <span><i class="bi bi-water"></i> Pileta</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Estacionamiento"> <span><i class="bi bi-p-circle"></i> Cochera</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Desayuno"> <span><i class="bi bi-cup-hot-fill"></i> Desayuno</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Parrilla"> <span><i class="bi bi-fire"></i> Parrilla / Quincho</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Aire acondicionado"> <span><i class="bi bi-snow2"></i> Aire acondicionado</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Calefacción"> <span><i class="bi bi-thermometer-sun"></i> Calefacción</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="TV"> <span><i class="bi bi-tv"></i> Smart TV</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Vista panorámica"> <span><i class="bi bi-binoculars"></i> Vista panorámica</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Lavandería"> <span><i class="bi bi-bag-heart"></i> Lavandería</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Jacuzzi"> <span><i class="bi bi-droplet-half"></i> Jacuzzi / Bañera</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Mascotas permitidas"> <span><i class="bi bi-github"></i> Mascotas permitidas</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Apto para niños"> <span><i class="bi bi-emoji-smile"></i> Apto para niños</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Seguridad 24h"> <span><i class="bi bi-shield-check"></i> Seguridad 24h</span></label>
          <label class="servicio-check"><input type="checkbox" name="servicios" value="Gym"> <span><i class="bi bi-bicycle"></i> Gimnasio</span></label>

        </div>
      </fieldset>

      <div class="campo-grupo">
        <label for="fotos"><i class="bi bi-camera"></i> Cargar imágenes</label>
        <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
        <small style="color:var(--gris-texto); font-size:0.78rem; margin-top:4px; display:block;">Podés subir varias fotos a la vez. Recomendado: al menos 3.</small>
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn-reserve" style="width: 100%; font-size: 1.05rem; padding: 14px;">
          <i class="bi bi-cloud-arrow-up"></i> Publicar alojamiento
        </button>
      </div>

    </form>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/publicar-alojamiento.js"></script>
  <script>requerirSesion("anfitrion");</script>
</body>
</html>
