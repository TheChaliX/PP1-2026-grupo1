<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — AlojAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .filtro-input {
      height: 48px;
      border-radius: 8px;
      border: 1px solid var(--gris-borde);
      padding: 10px 14px;
      width: 100%;
      color: var(--azul-profundo);
      outline: none;
      transition: all 0.2s;
    }
    .filtro-input:focus {
      border-color: var(--turquesa);
      box-shadow: 0 0 0 3px rgba(14, 168, 160, 0.15);
    }
    .input-icono-wrapper .filtro-input {
      padding-left: 38px !important;
    }
  </style>
</head>
<body class="catalogo">

  <div id="navbar-dinamica"></div>

  <main class="container-fluid" style="max-width: 1100px; padding: 20px;">
    <header class="text-center mb-4 mt-2">
      <h1 style="color: var(--azul-profundo); font-weight: 800; font-size: 2.2rem; margin-bottom: 5px;"><i class="bi bi-compass"></i> Explorá alojamientos</h1>
      <p style="color: var(--gris-texto);">Encontrá el lugar perfecto para tu próxima escapada</p>
    </header>

    <section class="filtros-section mb-5">
      <!-- Agregado display: block !important para anular flexbox conflictivo del viejo styles.css -->
      <form id="formFiltros" class="bg-white p-4 rounded-4 shadow-sm border" style="display: block !important; background: rgba(255,255,255,0.95);">
        
        <!-- Fila 1: Destino y Fechas -->
        <div class="row g-3 mb-3">
          <!-- Destino -->
          <div class="col-md-6">
            <label for="ubicacion" class="form-label fw-bold mb-1" style="color: var(--azul-profundo);"><i class="bi bi-geo-alt"></i> Destino</label>
            <div class="input-icono-wrapper">
              <i class="bi bi-geo-alt-fill input-icono"></i>
              <input type="text" id="ubicacion" name="ubicacion" class="filtro-input" placeholder="¿A dónde querés ir?">
            </div>
          </div>
          
          <!-- Llegada -->
          <div class="col-md-3 col-6">
            <label for="fecha-entrada" class="form-label fw-bold mb-1" style="color: var(--azul-profundo);"><i class="bi bi-calendar-event"></i> Llegada</label>
            <input type="date" id="fecha-entrada" name="fecha-entrada" class="filtro-input">
          </div>
          
          <!-- Salida -->
          <div class="col-md-3 col-6">
            <label for="fecha-salida" class="form-label fw-bold mb-1" style="color: var(--azul-profundo);"><i class="bi bi-calendar-check"></i> Salida</label>
            <input type="date" id="fecha-salida" name="fecha-salida" class="filtro-input">
          </div>
        </div>

        <!-- Fila 2: Tarifas y Botón -->
        <div class="row g-3 mb-3 align-items-end">
          <div class="col-md-4 col-6">
            <label for="tarifa-minima" class="form-label fw-bold mb-1" style="color: var(--azul-profundo);">Precio Min ($)</label>
            <input type="number" id="tarifa-minima" name="tarifa-minima" class="filtro-input" min="0" placeholder="Ej: 10000">
          </div>
          <div class="col-md-4 col-6">
            <label for="tarifa-maxima" class="form-label fw-bold mb-1" style="color: var(--azul-profundo);">Precio Max ($)</label>
            <input type="number" id="tarifa-maxima" name="tarifa-maxima" class="filtro-input" min="0" placeholder="Ilimitado">
          </div>
          <div class="col-md-4 mt-4 mt-md-0">
            <button type="submit" class="btn-reserve w-100" style="height: 48px; margin: 0; font-size: 1.05rem;">
              <i class="bi bi-search"></i> Buscar alojamientos
            </button>
          </div>
        </div>

        <!-- Fila 3: Servicios Extras -->
        <div class="pt-3 border-top d-flex flex-wrap align-items-center gap-3">
          <span class="fw-bold" style="color: var(--azul-profundo); font-size: 0.95rem;"><i class="bi bi-star"></i> Extras:</span>
          <label class="servicio-check m-0"><input type="checkbox" name="wifi" value="Wi-Fi"> <span>Wi-Fi</span></label>
          <label class="servicio-check m-0"><input type="checkbox" name="cocina" value="Cocina"> <span>Cocina</span></label>
          <label class="servicio-check m-0"><input type="checkbox" name="pileta" value="Pileta"> <span>Pileta</span></label>
          <label class="servicio-check m-0"><input type="checkbox" name="estacionamiento" value="Estacionamiento"> <span>Cochera</span></label>
          <label class="servicio-check m-0"><input type="checkbox" name="desayuno" value="Desayuno"> <span>Desayuno</span></label>
          
          <button type="reset" class="btn btn-link text-decoration-none text-muted p-0 ms-auto" style="font-size: 0.85rem;">
            <i class="bi bi-eraser"></i> Limpiar filtros
          </button>
        </div>
        
        <div id="mensaje-filtros" class="mensaje-filtros mt-3" style="display:none;"></div>
      </form>
    </section>

    <section class="resultados-section">
      <h2 class="mb-4" style="color: var(--azul-profundo);"><i class="bi bi-houses"></i> Propiedades recomendadas</h2>
      <div id="contenedor-catalogo" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>
    </section>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    document.querySelector("button[type='reset']")?.addEventListener("click", () => {
      setTimeout(() => {
        document.querySelector("#formFiltros")?.dispatchEvent(new Event("submit"));
      }, 50);
    });
  </script>
  <script src="assets/js/catalogo.js"></script>
</body>
</html>
