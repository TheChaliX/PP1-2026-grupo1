<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas recibidas — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="reservas-recibidas">

  <div id="navbar-dinamica"></div>

  <header class="page-header">
    <h1><i class="bi bi-inbox-fill"></i> Reservas recibidas</h1>
    <p>Gestioná las solicitudes de tus huéspedes</p>
  </header>

  <main class="reservas-recibidas-main">

    <div class="filtros-recibidas">
      <div class="filtro-item">
        <label for="filtro-texto"><i class="bi bi-search"></i> Buscar huésped</label>
        <input type="text" id="filtro-texto" placeholder="Nombre del huésped...">
      </div>
      <div class="filtro-item">
        <label for="filtro-propiedad"><i class="bi bi-house"></i> Propiedad</label>
        <select id="filtro-propiedad">
          <option value="todas">Todas las propiedades</option>
          <option value="casa-montanas">Casa en las montañas</option>
          <option value="cabana-pileta">Cabaña con pileta</option>
        </select>
      </div>
      <div class="filtro-item">
        <label for="filtro-estado"><i class="bi bi-funnel"></i> Estado</label>
        <select id="filtro-estado">
          <option value="todos">Todos los estados</option>
          <option value="confirmado">Confirmadas</option>
          <option value="pendiente">Pendientes</option>
          <option value="cancelado">Canceladas / Rechazadas</option>
        </select>
      </div>
    </div>

    <div id="contenedor-reservas-recibidas"></div>

  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/reservas-recibidas.js"></script>
</body>
</html>
