<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="perfil">

    <header>
        <nav class="navbar">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="reservas.html">Mis reservas</a>
            <a href="publicar-alojamiento.html">Publicar alojamiento</a>
            <a href="perfil.html">Mi perfil</a>
        </nav>

        <h1>Mi perfil</h1>
        <p>Huésped</p>
    </header>

    <main class="perfil-main">

        <section class="perfil-card">

            <h2>Datos personales</h2>

            <form>

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="Thiago Sarco"
                    required
                >

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="thiago@example.com"
                    required
                >

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    value="342 555 1234"
                >

                <button type="submit">
                    Guardar cambios
                </button>

            </form>

        </section>

        <section class="perfil-card">

            <h2>Seguridad</h2>

            <form>

                <label for="password">
                    Nueva contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresá una nueva contraseña"
                >

                <label for="password-confirm">
                    Confirmar nueva contraseña
                </label>

                <input
                    type="password"
                    id="password-confirm"
                    name="password-confirm"
                    placeholder="Repetí la nueva contraseña"
                >

                <button type="submit">
                    Cambiar contraseña
                </button>

            </form>

        </section>

    </main>

    <footer>
        <small>Grupo 1 — PP1 2026</small>
    </footer>

</body>

</html>
