<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil — AlojAR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="perfil">

  <div id="navbar-dinamica"></div>

  <header class="page-header">
    <h1><i class="bi bi-person-circle"></i> Mi perfil</h1>
    <p>Datos de tu cuenta</p>
  </header>

  <main class="perfil-main">
    <section class="perfil-card">
      <h2><i class="bi bi-person-lines-fill"></i> Datos de la cuenta</h2>
      <p class="text-muted mb-4">Actualizá tu información personal y de seguridad.</p>
      
      <form id="formPerfil">
        <div class="campo-grupo">
          <label for="nombre">Nombre completo</label>
          <div class="input-icono-wrapper">
            <i class="bi bi-person-fill input-icono"></i>
            <input type="text" id="nombre" name="nombre" value="" required>
          </div>
        </div>

        <div class="campo-grupo">
          <label for="email">Correo electrónico</label>
          <div class="input-icono-wrapper">
            <i class="bi bi-envelope-fill input-icono"></i>
            <input type="email" id="email" name="email" value="" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
          </div>
        </div>

        <h3 class="mt-4 mb-3" style="font-size: 1.1rem;"><i class="bi bi-shield-lock"></i> Seguridad</h3>
        
        <div class="campo-grupo">
          <label for="password">Nueva contraseña</label>
          <div class="input-icono-wrapper">
            <i class="bi bi-key-fill input-icono"></i>
            <input type="password" id="password" name="password" placeholder="Ingresá una nueva contraseña">
          </div>
        </div>

        <div class="campo-grupo">
          <label for="password-confirm">Confirmar nueva contraseña</label>
          <div class="input-icono-wrapper">
            <i class="bi bi-key-fill input-icono"></i>
            <input type="password" id="password-confirm" name="password-confirm" placeholder="Repetí la nueva contraseña">
          </div>
        </div>

        <button type="button" class="btn-reserve mt-3" onclick="mostrarModal('Información guardada con éxito', 'exito')"><i class="bi bi-check2-circle"></i> Guardar cambios</button>
      </form>
    </section>
  </main>

  <footer><small>Grupo 1 — PP1 2026</small></footer>

  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    // Llenar datos
    const usuario = requerirSesion();
    if (usuario) {
      document.getElementById('email').value = usuario.email;
    }
  </script>
</body>
</html>
